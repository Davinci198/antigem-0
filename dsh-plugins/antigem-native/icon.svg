<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="AntiGem native bridge">
  <defs>
    <linearGradient id="agnBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f8fe0"/>
      <stop offset="1" stop-color="#17539b"/>
    </linearGradient>
    <linearGradient id="agnLink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd0ff"/>
      <stop offset="1" stop-color="#c9ecff"/>
    </linearGradient>
  </defs>

  <!-- phone body: the app side of the bridge -->
  <rect x="30" y="10" width="24" height="44" rx="7" fill="url(#agnBody)"/>
  <rect x="34" y="16" width="16" height="26" rx="3" fill="#eaf5ff" opacity="0.92"/>
  <rect x="39.5" y="46" width="5" height="3" rx="1.5" fill="#cfe8ff"/>

  <!-- chat bubble: the harness side -->
  <path d="M12 14h12a6 6 0 0 1 6 6v9a6 6 0 0 1-6 6h-7l-6 5v-5h-1a6 6 0 0 1-6-6v-9a6 6 0 0 1 6-6Z" fill="#ffffff" stroke="#17539b" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="14" cy="24.5" r="1.8" fill="#2f8fe0"/>
  <circle cx="19.5" cy="24.5" r="1.8" fill="#2f8fe0"/>
  <circle cx="25" cy="24.5" r="1.8" fill="#2f8fe0"/>

  <!-- link pin joining both sides -->
  <path d="M24 26.5h6" fill="none" stroke="url(#agnLink)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="30" cy="26.5" r="3.4" fill="#7fd0ff" stroke="#17539b" stroke-width="1.8"/>
</svg>
